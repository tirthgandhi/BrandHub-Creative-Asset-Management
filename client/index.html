<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        const saved = localStorage.getItem('brandhub-color-theme') || 'system';
        const resolved = saved === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved;
        document.documentElement.dataset.colorTheme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0757a3" />
    <title>BRANDHUB — A World for Creative Ideas</title>
    <meta
      name="description"
      content="Discover BRANDHUB, an immersive creative brand experience built around beautiful visuals, imaginative storytelling, and space for every idea."
    />
    <meta property="og:title" content="BRANDHUB — A World for Creative Ideas" />
    <meta
      property="og:description"
      content="One beautiful space for everything your brand creates."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/social-preview.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript
      >Please enable JavaScript to explore the interactive BRANDHUB
      experience.</noscript
    >
  </body>
</html>
