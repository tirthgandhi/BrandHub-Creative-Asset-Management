services:
  - type: web
    name: brandhub-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MEDIA_IMAGE_MAX_BYTES
        value: "5242880"
      - key: MEDIA_VIDEO_MAX_BYTES
        value: "20971520"
      - key: GRIDFS_UPLOAD_BUDGET_BYTES
        value: "262144000"
